name: Public CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install analytics dependencies
        run: |
          python3 -m pip install \
            -r requirements-analytics.txt

      - name: Compile Python
        run: |
          python3 -m compileall -q \
            config \
            src \
            tests

      - name: Run unit tests
        run: |
          python3 -m unittest discover \
            -s tests \
            -v
